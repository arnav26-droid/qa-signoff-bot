display_information:
  name: QA Signoff Bot
  description: Branch reservation locking + structured QA signoffs, via one /qa command
  background_color: "#2c2d30"
features:
  bot_user:
    display_name: qa-signoff-bot
    always_online: true
  slash_commands:
    - command: /qa
      description: Claim/release a branch or submit a QA signoff
      should_escape: false
    - command: /qa-status
      description: See who has which branch claimed
      should_escape: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - commands
      - im:write
      - users:read
settings:
  event_subscriptions:
    bot_events: []
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
